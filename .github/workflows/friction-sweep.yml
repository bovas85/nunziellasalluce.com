name: Friction Sweep

on:
  schedule:
    # Daily at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  friction-sweep:
    name: Friction Sweep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GEMINI_CLI_LLM availability
        id: check-env
        env:
          GEMINI_CLI_LLM: ${{ secrets.GEMINI_CLI_LLM }}
        run: |
          if [ -z "$GEMINI_CLI_LLM" ]; then
            echo "GEMINI_CLI_LLM not configured; skipping friction-sweep."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check-env.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        if: steps.check-env.outputs.enabled == 'true'
        run: yarn install --frozen-lockfile

      - name: Configure git identity for PR commits
        if: steps.check-env.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Gemini CLI Friction Sweep
        if: steps.check-env.outputs.enabled == 'true'
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_CLI_LLM }}
          gemini_model: "gemini-2.5-flash"
          settings: |
            {
              "model": {
                "maxSessionTurns": 30
              }
            }
          prompt: |
            Read AGENTS.md and .agents/skills/friction-log/SKILL.md.
            1. Check open PRs via `gh pr list --state open --json number,title,headRefName,body` and open `friction` issues via `gh issue list --label friction --state open --json number,title,labels,body`.
            2. Work highest priority first (`P0 > P1 > P2 > P3`). Skip any issue labeled `needs-human` or already addressed by an open PR.
            3. Close already-fixed or invalid friction issues with a short explanatory comment.
            4. Otherwise pick the single highest-priority actionable friction issue, fix it on a new branch, run `yarn verify`, and open ONE pull request using `.github/PULL_REQUEST_TEMPLATE.md`. Never push directly to main and never merge a PR.
