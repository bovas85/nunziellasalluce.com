name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run full verify gate (prepare, lint, typecheck, format, map, tests)
        run: yarn verify

      - name: Run Codacy Coverage Reporter
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          CODACY_ORGANIZATION_PROVIDER: gh
          CODACY_USERNAME: bovas85
          CODACY_PROJECT_NAME: nunziellasalluce.com
        run: |
          if [ -n "$CODACY_API_TOKEN" ]; then
            bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage/lcov.info
          else
            echo "CODACY_API_TOKEN not set; skipping Codacy coverage report"
          fi
