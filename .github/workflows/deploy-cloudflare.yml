name: Deploy Cloudflare (Alchemy)

on:
  push:
    branches:
      - main
      - explore/alchemy-effect
  pull_request:
    branches:
      - main
      - explore/alchemy-effect
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-cloudflare:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Verify Cloudflare environment
        id: check-env
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare credentials not available (e.g. Dependabot PR or missing secrets); skipping Cloudflare deploy preview."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            yarn alchemy provider check-env
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CASE_STUDY_PASSWORD: ${{ secrets.CASE_STUDY_PASSWORD }}

      - name: Deploy Nuxt stack to Cloudflare via Alchemy
        id: deploy
        if: steps.check-env.outputs.skip != 'true'
        run: |
          OUTPUT=$(yarn alchemy deploy --yes --no-input)
          echo "$OUTPUT"
          DEPLOY_URL=$(echo "$OUTPUT" | grep -o "https://[^']*workers\.dev" | head -n 1)
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CASE_STUDY_PASSWORD: ${{ secrets.CASE_STUDY_PASSWORD }}
          PROTECTED_CASE_STUDIES: ${{ vars.PROTECTED_CASE_STUDIES || '' }}

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deploy_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = '${{ steps.deploy.outputs.deploy_url }}';
            const body = `### 🚀 Cloudflare Deploy Preview\n\nPreview URL: ${deployUrl}\nCommit: \`${{ github.event.pull_request.head.sha }}\`\n\n_Deployed automatically via Alchemy for human review._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body.includes('Cloudflare Deploy Preview'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Verify production deployment health
        if: github.ref == 'refs/heads/main'
        run: |
          TARGET_URL="${{ steps.deploy.outputs.deploy_url }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://nunziellasalluce.com"
          fi
          echo "Verifying health against: $TARGET_URL"
          node tools/verify-deploy-health.mjs --url "$TARGET_URL" --expected-sha "${{ github.sha }}"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
