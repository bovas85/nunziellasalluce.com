name: Docs Freshness

on:
  schedule:
    # Daily at 07:30 UTC
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  docs-freshness:
    name: Docs Freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check recent commits and GEMINI_CLI_LLM
        id: guard
        env:
          GEMINI_CLI_LLM: ${{ secrets.GEMINI_CLI_LLM }}
        run: |
          if [ -z "$GEMINI_CLI_LLM" ]; then
            echo "GEMINI_CLI_LLM not configured; skipping docs-freshness."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RECENT=$(git log -n 1 --since="24 hours ago" --format="%H")
          if [ -z "$RECENT" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No commits in the last 24h; skipping."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: yarn install --frozen-lockfile

      - name: Configure git identity for PR commits
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Gemini CLI Docs Freshness
        if: steps.guard.outputs.enabled == 'true'
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_CLI_LLM }}
          gemini_model: "gemini-3.8-flash"
          settings: |
            {
              "model": {
                "maxSessionTurns": 60
              }
            }
          prompt: |
            Read AGENTS.md, README.md, docs/primitives.md, docs/feature-flags.md, docs/disaster-recovery.md, docs/adr/README.md, and .agents/skills/.
            Check if recent commits (`git log -n 10 --stat`) made any doc, Feature Map note, primitive `adrs` list, or skill stale.
            If stale docs/skills exist, create a new branch, update them cleanly (preserving markdownlint 80-char prose lines), run `yarn verify`, and open at most ONE pull request using `.github/PULL_REQUEST_TEMPLATE.md`. Never push directly to main and never merge a PR. If everything is current, exit without opening a PR.
