# Deprecation: Production and preview hosting has migrated to Cloudflare Workers via Alchemy.
# Build is ignored across all contexts (production and deploy-previews) to prevent duplicate runs.
[build]
  command = "yarn generate"
  publish = "dist"
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "24"
  YARN_FLAGS = "--production=false --ignore-engines"

[context.production]
  ignore = "exit 0"

[context.deploy-preview]
  ignore = "exit 0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404
